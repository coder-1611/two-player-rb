name: firebase-watch
# V491 (the owner: "make sure I find out about any outages"): every 15 minutes GitHub checks the game's database and the
# three sites from its own machines, so it works with Firebase and the owner's Mac both down. A problem opens an issue
# (label "outage") that @-mentions the owner — GitHub emails it and pushes it to its app — and the issue closes itself,
# with a comment, when everything answers again. The Mac's watcher (tools/fb-watch.js) runs this workflow with a message
# for what only it can measure: Firebase's usage meters (label "usage"), and DOWN/UP from its own checks.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'down | up | usage (empty = run the check)'
        required: false
        default: ''
      title:
        required: false
        default: ''
      body:
        required: false
        default: ''

permissions:
  issues: write
  contents: read

concurrency:
  group: firebase-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/github-script@v7
        env:
          KIND: ${{ github.event.inputs.kind }}
          TITLE: ${{ github.event.inputs.title }}
          BODY: ${{ github.event.inputs.body }}
        with:
          script: |
            const OWNER = 'coder-1611';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const when = () => new Date().toLocaleString('en-US', { timeZone: 'America/Chicago' }) + ' (Central)';
            async function label(name, color, description) {
              try { await github.rest.issues.getLabel({ ...repo, name }); }
              catch (e) { await github.rest.issues.createLabel({ ...repo, name, color, description }); }
            }
            const openOf = async name => (await github.rest.issues.listForRepo({ ...repo, state: 'open', labels: name, per_page: 20 })).data;
            async function raise(name, title, body) {          // one open issue per label: a new one, or a comment on it
              await label(name, name === 'outage' ? 'd73a4a' : 'fbca04', name === 'outage' ? 'The game database or a site is down (firebase-watch)' : 'Firebase usage near or over the free plan (firebase-watch)');
              const cur = (await openOf(name))[0];
              if (cur) await github.rest.issues.createComment({ ...repo, issue_number: cur.number, body: '@' + OWNER + ' ' + body });
              else await github.rest.issues.create({ ...repo, title, labels: [name], body: '@' + OWNER + '\n\n' + body });
            }
            async function settle(name, body) {               // close what is fixed, saying so
              for (const i of await openOf(name)) {
                await github.rest.issues.createComment({ ...repo, issue_number: i.number, body: '@' + OWNER + ' ' + body });
                await github.rest.issues.update({ ...repo, issue_number: i.number, state: 'closed' });
              }
            }
            const kind = process.env.KIND || '';
            if (context.eventName === 'workflow_dispatch' && kind) {   // a message from the Mac's watcher
              const body = (process.env.BODY || '') + '\n\n_Sent by the Mac\'s watcher (tools/fb-watch.js)._';
              if (kind === 'up') await settle('outage', body);
              else await raise(kind === 'down' ? 'outage' : 'usage', process.env.TITLE || 'Firebase alert', body);
              return;
            }
            // the check: the database (a public read of a few bytes) and the three sites, each tried three times
            async function check(url, test) {
              let last = { ok: false, status: 0, why: '' };
              for (let i = 0; i < 3; i++) {
                try {
                  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'cb=' + Date.now(), { signal: AbortSignal.timeout(20000) });
                  const t = await r.text();
                  if (r.ok && test(t)) return { ok: true, status: r.status };
                  last = { ok: false, status: r.status, why: t.slice(0, 160).replace(/\s+/g, ' ') };
                } catch (e) { last = { ok: false, status: 0, why: String(e.message || e).slice(0, 160) }; }
                await new Promise(res => setTimeout(res, 8000));
              }
              return last;
            }
            const targets = {
              'the game database (Firebase)': ['https://realretrobowl2p-default-rtdb.firebaseio.com/embedcode/potd/date.json', t => /^"\d{4}-\d\d-\d\d/.test(t)],
              'two-player-rb.vercel.app': ['https://two-player-rb.vercel.app/', t => /RETRO BOWL/.test(t)],
              'coder-1611.github.io/two-player-rb': ['https://coder-1611.github.io/two-player-rb/', t => /RETRO BOWL/.test(t)],
              'realretrobowl2p.web.app': ['https://realretrobowl2p.web.app/', t => /RETRO BOWL/.test(t)],
            };
            const bad = [];
            for (const [name, [url, test]] of Object.entries(targets)) {
              const r = await check(url, test);
              core.info(name + ': ' + (r.ok ? 'OK' : 'FAILED ' + r.status + ' ' + (r.why || '')));
              if (!r.ok) bad.push('- **' + name + '** is not answering (HTTP ' + r.status + (r.why ? ': `' + r.why + '`' : '') + ')');
            }
            const open = await openOf('outage');
            if (bad.length && !open.length) {
              await raise('outage', bad.length === 1 && bad[0].includes('Firebase') ? 'Firebase is down' : 'Retro Bowl 2P is down',
                bad.join('\n') + '\n\nChecked by GitHub at ' + when() + '. This issue closes itself when everything answers again.');
            } else if (!bad.length && open.length) {
              await settle('outage', 'Everything answers again (' + when() + ').');
            }
