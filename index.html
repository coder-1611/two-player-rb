    <!-- Capture-phase keyboard shield. GameMaker's HTML5 runner binds global
         keydown/keyup listeners and preventDefault()s most keys to stop the
         browser from scrolling, tab-cycling, etc. That also kills typing in
         any HTML input we overlay. This listener runs in the capture phase
         (before GameMaker's bubble-phase handler) and stops propagation for
         any keyboard event whose target sits inside the lobby DOM, so the
         browser's native text-input default action still fires but GameMaker
         never gets a chance to preventDefault on it. -->
    <script>
        (function () {
            // stopImmediatePropagation in capture phase blocks target-phase
            // listeners too (DOM spec: propagation stops AT capture, target
            // listeners never fire). That's intentional — we don't want
            // GameMaker to see the key — but it also kills any listener we
            // attach to the input (e.g. "Enter -> submit"). So we handle
            // those key bindings here in the shield itself.
            function shieldLobby(e) {
                var lob = document.getElementById('rb-lobby');
                if (!lob || lob.style.display === 'none') return;
                var tgt = e.target;
                if (!tgt || !tgt.closest) return;
                if (!tgt.closest('#rb-lobby')) return;

                // Enter on the room-code input triggers JOIN
                if (e.type === 'keydown' && e.key === 'Enter' &&
                    tgt.id === 'rb-room-input') {
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    var joinBtn = document.getElementById('rb-join');
                    if (joinBtn && !joinBtn.disabled) joinBtn.click();
                    return;
                }

                // Block everything else from reaching GameMaker. We do NOT
                // preventDefault — the browser still needs to insert chars,
                // delete via backspace, move cursor with arrows, etc.
                e.stopImmediatePropagation();
            }
            ['keydown', 'keypress', 'keyup'].forEach(function (t) {
                document.addEventListener(t, shieldLobby, true);
                window.addEventListener(t, shieldLobby, true);
            });
        })();
    </script>

                        // any "PopUps"-layer instances spawned during

                        // user-PAT authorized list). We DON'T touch

                        // relies on its natural cascade to fire the

            // When the cascade reaches a state that needs case 10, _Vy hangs

            // in WAITING forever.
            //

            //   4  = 4th-down go-for-it path (calls case 10 to "pick play")

            //

            // inferUserDriveEndType returns 'TD' and the receiver gets a proper kickoff
            // (own 25). Otherwise vyStage = 8 (turnover-on-downs).
            var deadEngineFsmStages = { 4: true, 10: true, 11: true };
            var stuckEngineFsmStage = null, engineFsmStageStuckSinceMs = 0, lastUserScoreObserved = -1;
            setInterval(function () {
                try {
                    if (!RB.isEngineInMatchRoom()) return;
                    if (window._rb2p_userIsWaitingForOpponent === true) return;  // already handed off
                    var engineMatch = RB.engineState();
                    if (!engineMatch || engineMatch.engineUserTeamIdx == null || engineMatch.engineScoreboard == null) return;

                    // Track score so we can pick TD vs FG vs turnover for
                    // the forced end. Treat score regression as an external
                    // reset (e.g. new drive setup) — re-baseline lastUserScoreObserved.
                    var myScore = engineMatch.userScore;
                    if (lastUserScoreObserved < 0 || myScore < lastUserScoreObserved) lastUserScoreObserved = myScore;

                    if (engineMatch.engineDriveFsmStage !== stuckEngineFsmStage) {
                        stuckEngineFsmStage = engineMatch.engineDriveFsmStage;
                        engineFsmStageStuckSinceMs = Date.now();
                        return;
                    }
                    if (!deadEngineFsmStages[engineMatch.engineDriveFsmStage]) return;
                    // V59: 800ms (was 1500) — these stages are genuinely dead
                    // (AI offense is gutted), so a shorter dwell just makes
                    // the handoff to the WAIT cover snappier. Still 3+ poll
                    // cycles above the 250ms tick, and the apply-cooldown /
                    // sendInProgress guards below prevent premature ends.
                    if (Date.now() - engineFsmStageStuckSinceMs < 800) return;
                    if (Date.now() - (window._rb2p_lastOpponentOutcomeApplyMs || 0) < 3000) return;
                    if (window._rb2p_userOutcomeSendInProgress) return;

                    // Pick the end-Vy from the score delta so the receiver
                    // gets the right outcome type:
                    //   delta ≥ 6 → vyStage = 9  (TD)       → 'TD'  → kickoff (random 25-40)
                    //   delta ≥ 3 → vyStage = 14 (FG made)  → 'FG'  → kickoff (random 25-40)
                    //   delta = 0 → vyStage = 8  (turnover) → 'INT' → spot of downed ball
                    var scoreDelta = myScore - lastUserScoreObserved;
                    var endVy;
                    if      (scoreDelta >= 6) endVy = 9;
                    else if (scoreDelta >= 3) endVy = 14;
                    else                       endVy = 8;
                    console.log('[2P] drive stuck at vyStage=' + engineMatch.engineDriveFsmStage + ' for ' +
                                (Date.now() - engineFsmStageStuckSinceMs) + 'ms — forcing end as Vy=' + endVy +
                                ' (myScore ' + lastUserScoreObserved + '→' + myScore + ', delta ' + scoreDelta + ')');
                    engineMatch.engineDriveFsmStage = endVy;
                    engineMatch.enginePriorFsmStage = endVy;   // _1c1 reads priorVy || vyStage via inferUserDriveEndType

                    if (typeof changePossession === 'function') changePossession(engineMatch.rawEngineMatch, _Sc2);
                    lastUserScoreObserved = myScore;
                    engineFsmStageStuckSinceMs = Date.now();
                } catch (e) {}
            }, 250);

            // ===== Bidirectional UD watchdog =====
            // Rule:
            //   _rb2p_userIsWaitingForOpponent === false → user is on offense.
            //     _._UD must === _._0z so the engine runs user-offense logic.
            //   _rb2p_userIsWaitingForOpponent === true  → opponent is on offense.
            //     _._UD must !== _._0z so the engine treats us as defense AND
            //     so the live-sync receiver's gate (`m._UD !== m._0z`) stays
            //     OPEN. That gate is what writes incoming scoreboard/clock
            //     values into _._Sb1 / _._r11 / _._s11 — without it, the
            //     in-game scoreboard freezes at its initial values while the
            //     HTML waiting overlay (which has no gate) still updates.
            //
            // _Ib1 writes possession in both directions on its own, so
            // without this watchdog every ~100ms _Ib1 can stomp the live-
            // sync gate.
            setInterval(function () {
                try {
                    if (!RB.isEngineInMatchRoom()) return;
                    var engineMatch = RB.engineState();
                    if (!engineMatch || engineMatch.engineUserTeamIdx == null) return;
                    // SUSPENDED during pick-6 cascade: the engine's PAT
                    // processing legitimately keeps possession on the
                    // OPPONENT (the defensive scoring team) so the +1 / +2
                    // credits the right side. Clamping would steal the PAT.
                    if (window._rb2p_pickSixPatCascadeActive === true) return;
                    if (window._rb2p_userIsWaitingForOpponent === true) {
                        // Defense: opponent owns the ball in the engine's view.
                        if (engineMatch.enginePossessingTeamIdx === engineMatch.engineUserTeamIdx) {
                            engineMatch.enginePossessingTeamIdx = engineMatch.engineOpponentTeamIdx;
                        }
                    } else {
                        // Offense: user owns the ball.
                        if (engineMatch.enginePossessingTeamIdx !== engineMatch.engineUserTeamIdx) {
                            engineMatch.enginePossessingTeamIdx = engineMatch.engineUserTeamIdx;
                        }
                    }
                } catch (e) {}
            }, 100);

            // ===== Pick-6 cascade completion watcher =====
            // Detects when the engine has finished the kickoff cascade
            // after a pick-6 and A is back on offense. Clears the suspend
            // flag so the possession watchdog and _Ib1 wrapper can resume
            // clamping. (The engine-PAT-modal suppressor INSIDE the _Ib1
            // wrapper is also gated by this flag, and goes inert once
            // cleared here.)
            setInterval(function () {
                try {
                    if (window._rb2p_pickSixPatCascadeActive !== true) return;
                    if (!RB.isEngineInMatchRoom()) return;
                    var engineMatch = RB.engineState();
                    if (!engineMatch || engineMatch.engineUserTeamIdx == null) return;
                    var elapsedSinceFlagRaised = Date.now() -
                        (window._rb2p_pickSixPatCascadeRaisedMs || 0);
                    // V50: minimum hold of 3 s to avoid clearing right after the
                    // PICK6 setup mutations (which on B make conditions
                    // immediately look like "active play"). After that, event-
                    // driven clear:
                    //   - On the PAT-PLAYING device (engineDownNumber === 6):
                    //     wait until the PAT-pending marker clears. _1c1 sets
                    //     engineDownNumber back to 1 after the post-PAT kickoff,
                    //     so this fires once the PAT is genuinely complete and
                    //     possession has flipped — not on a hard-coded timer.
                    //   - On the WAITING device (engineDownNumber !== 6 the
                    //     whole time, because V39's _Bk1 suppressor prevents
                    //     _hB case 0 from ever setting _._t11 = 6 on A): wait
                    //     until user is back on offense (the old condition).
                    // Hard fallback of 60 s catches stuck states (backgrounded
                    // tabs, etc.).
                    if (elapsedSinceFlagRaised < 3000) return;
                    // V57: never hard-timeout while the PAT play is live on
                    // this device — the guardian owns that state and has its
                    // own 120 s cap.
                    if (window._rb2p_patPlayPending === true ||
                        window._rb2p_patPlayResolved === true) return;
                    if (elapsedSinceFlagRaised >= 60000) {
                        window._rb2p_pickSixPatCascadeActive = false;
                        window._rb2p_pickSixThisDeviceIsThrower = false;
                        window._rb2p_lastOpponentOutcomeApplyMs = Date.now();
                        window._rb2p_userScoreAtDriveStart = engineMatch.userScore;
                        window._rb2p_opponentScoreAtDriveStart = engineMatch.opponentScore;
                        console.log('[2P PICK6] cascade force-cleared after 60s hard timeout');
                        return;
                    }
                    // PAT-playing device: hold until PAT-pending marker clears
                    if (engineMatch.engineDownNumber === 6) return;
                    // PAT done on this device (or never started locally). Old
                    // condition: wait for user-back-on-offense signal.
                    if (engineMatch.enginePossessingTeamIdx === engineMatch.engineUserTeamIdx &&
                        engineMatch.engineControllerState === 2) {
                        window._rb2p_pickSixPatCascadeActive = false;
                        window._rb2p_pickSixThisDeviceIsThrower = false;
                        window._rb2p_lastOpponentOutcomeApplyMs = Date.now();
                        window._rb2p_userScoreAtDriveStart = engineMatch.userScore;
                        window._rb2p_opponentScoreAtDriveStart = engineMatch.opponentScore;
                        console.log('[2P PICK6] cascade complete after ' +
                                    elapsedSinceFlagRaised + 'ms (event-driven) — watchdog re-engaged');
                    }

            }, 150);

            // ===== B's PAT_RESULT outcome (Firebase) =====
            // Wired into applyOpponentOutcome's dispatcher below. Helper
            // here applies B's PAT score on A's side and starts A's next
            // drive via a fresh kickoff (random own 25..40, negative

            // side of the engine's signed yardLine convention).
            window._rb2p_applyOpponentPatResult = function (outcome) {
                try {
                    var engineMatch = RB.engineState();

                    if (typeof outcome.secondsLeft  === 'number') engineMatch.engineSecondsLeft = outcome.secondsLeft;
                    engineMatch.engineTickAllowance = 0;
                    window._rb2p_pickSixPatCascadeActive    = false;
                    window._rb2p_pickSixThisDeviceIsThrower = false;
                    window._rb2p_patPlayPending  = false;
                    window._rb2p_patPlayResolved = false;
                    window._rb2p_userIsWaitingForOpponent  = false;
                    window._rb2p_userOutcomeSendInProgress = false;
                    window._rb2p_lastOpponentOutcomeApplyMs = Date.now();

                        console.log('[2P PICK6] PAT_RESULT applied (scores only — drive already running)');
                    }
                } catch (e) { console.log('[2P PICK6 PAT_RESULT err]', e); }
            };

            // ===== V57: PAT guardian (SCORER device) =====
            // Engine fact (retrobowl.js s_action_result): a 2-pt snap result

            // engine calls _1c1 (flipping possession), credits +6 to the
            // FLIPPED side (the wrong team), and re-pops the PAT modal,
            // looping the whole sequence. Anything that resets _t11 mid-PAT

            // the wrong team" symptom. The guardian:

                        window._rb2p_patPlayResolved !== true) return;

                    if (window._rb2p_pickSixPatCascadeActive !== true) {
                        window._rb2p_patPlayPending  = false;
                        window._rb2p_patPlayResolved = false;
                        return;
                    }
                    var em = RB.engineState();
                    if (!em || em.engineUserTeamIdx == null) return;
                    if (window._rb2p_patPlayPending === true) {
                        // Hard cap: a PAT cannot take 2 minutes. Resolve as
                        // miss so the synthetic send below unblocks the game.
                        if (Date.now() - (window._rb2p_patPlayStartMs || 0) > 120000) {
                            window._rb2p_patPlayPending  = false;
                            window._rb2p_patPlayResolved = true;
                            window._rb2p_patResolvedMs   = 0;   // forces immediate synthetic send
                            console.warn('[2P PAT GUARD] 120s cap hit — resolving as miss');
                            return;
                        }
                        var userDelta = em.userScore - (window._rb2p_patUserScoreAtStart || 0);
                        var oppDelta  = em.opponentScore - (window._rb2p_patOppScoreAtStart || 0);
                        // Wrongful fresh-TD repair: the engine credited the
                        // OPPONENT during OUR PAT (the _t11<6 misroute).

                            em.setOpponentScore(window._rb2p_patOppScoreAtStart || 0);
                            em.enginePossessingTeamIdx = em.engineUserTeamIdx;
                            em.engineDownNumber = 6;
                            em.engineYardsToGo  = 2;
                            if (window._rb2p_notePick6BaselineSync) window._rb2p_notePick6BaselineSync();
                            console.warn('[2P PAT GUARD] engine credited +' + oppDelta +
                                         ' to OPPONENT mid-PAT (fresh-TD misroute) — undone, PAT state restored');
                            if (window._rb2p_pick6MonitorNote) window._rb2p_pick6MonitorNote('WRONG-TEAM +' + oppDelta + ' repaired');
                            return;

                            // results. Anything else (+3 = the engine took
                            // the FG branch because _Z21 wasn't set, etc.) is
                            // an anomaly — but the PAT is settled either way;
                            // staying "pending" forever would freeze the
                            // cascade, which is worse. Resolve and report.
                            if (userDelta > 2) {
                                console.warn('[2P PAT GUARD] anomalous PAT credit +' + userDelta +
                                             ' (expected 1 or 2) — resolving anyway');
                                if (window._rb2p_pick6MonitorNote) window._rb2p_pick6MonitorNote(
                                    'ANOMALY: PAT credited +' + userDelta);
                            }
                            window._rb2p_patPlayPending  = false;
                            window._rb2p_patPlayResolved = true;
                            window._rb2p_patResolvedMs   = Date.now();
                            window._rb2p_patResultPoints = userDelta;
                            console.log('[2P PAT GUARD] PAT resolved: +' + userDelta + ' (made)');
                            if (window._rb2p_pick6MonitorNote) window._rb2p_pick6MonitorNote('PAT made: +' + userDelta);
                            return;
                        }

                        // miss path; _Vy 22 = the dead end s_action_result's
                        // case 2 takes when a 2-pt miss is processed with a
                        // clobbered _t11 (< 6) — also a miss, but the FSM

                             em.engineDriveFsmStage === 22) && userDelta === 0) {
                            window._rb2p_patPlayPending  = false;
                            window._rb2p_patPlayResolved = true;
                            window._rb2p_patResolvedMs   = Date.now();
                            window._rb2p_patResultPoints = 0;
                            console.log('[2P PAT GUARD] PAT resolved: missed (Vy=' +
                                        em.engineDriveFsmStage + ')');
                            if (window._rb2p_pick6MonitorNote) window._rb2p_pick6MonitorNote(

                            return;
                        }

                            em.engineDownNumber = 6;
                            em.engineYardsToGo  = 2;
                            console.warn('[2P PAT GUARD] _t11 clobbered mid-PAT — re-asserted 6');

                    // PAT_RESULT (the _1c1 hook clears these flags when it
                    // does). If it never fires, send synthetically.
                    if (Date.now() - (window._rb2p_patResolvedMs || 0) > 5000) {
                        console.warn('[2P PAT GUARD] kickoff _1c1 never fired — sending synthetic PAT_RESULT');
                        var names = em.engineTeamDisplayNames || ['', ''];
                        try {
                            window._twoPlayer.send({
                                type: 'PAT_RESULT',
                                yardLine: 0,
                                ownSide: true,
                                scoreUser: em.userScore,
                                scoreOpp:  em.opponentScore,
                                quarter:   em.engineQuarter,
                                minutesLeft: em.engineMinutesLeft,
                                secondsLeft: em.engineSecondsLeft,
                                fromTeam: names[em.engineUserTeamIdx] || '',
                                toTeam:   names[em.engineUserTeamIdx ? 0 : 1] || '',
                                message: 'PAT result',
                                ts: Date.now()
                            });
                        } catch (eS) { console.log('[2P] send err', eS); }
                        window._rb2p_patResultSentMs = Date.now();
                        window._rb2p_patPlayPending  = false;
                        window._rb2p_patPlayResolved = false;
                        window._rb2p_pickSixPatCascadeActive    = false;
                        window._rb2p_pickSixThisDeviceIsThrower = false;
                        window._rb2p_userPatPopupRefs = null;
                        window._rb2p_userOutcomeSendInProgress = true;
                        window._rb2p_userIsWaitingForOpponent  = true;
                        if (window._rb2p_pick6MonitorNote) window._rb2p_pick6MonitorNote('synthetic PAT_RESULT sent');
                    }
                } catch (e) {}
            }, 100);

            // ===== V57: always-on pick-6 monitor =====
            // Arms automatically on BOTH devices whenever a pick-6 cascade
            // starts (enterPickSixCascade on the thrower, the PICK6 applier
            // on the scorer). Samples engine + bridge state at 100 ms, logs
            // every transition as [2P MON] lines, and prints a ✅/❌ verdict
            // report when the cascade ends. Re-read the last report any time

            window._rb2p_pick6MonitorArm = function (role, source) {

                    role: role, source: source, t0: Date.now(),
                    notes: [], modalPops: 0, modalConsec: 0, modalMaxConsec: 0,
                    startUser: em ? em.userScore : null,
                    startOpp:  em ? em.opponentScore : null,

                    console.table([{
                        role: role,
                        trigger: source,
                        yourScore: pick6Mon.startUser,
                        oppScore: pick6Mon.startOpp,
                        down_t11: em ? em.engineDownNumber : null,
                        fsm_Vy:   em ? em.engineDriveFsmStage : null,
                        possession: em ? (em.enginePossessingTeamIdx === em.engineUserTeamIdx ? 'YOU' : 'OPPONENT') : null,
                        expectation: role === 'SCORER'
                            ? 'PAT modal pops ONCE here; +1/+2 to YOU; PAT_RESULT sent'
                            : 'no modal here; opponent +6..8; PAT_RESULT arrives; your drive restarts'
                    }]);
                } catch (eT) {}
            };
            function pick6MonFinish(reason) {
                var m = pick6Mon;
                pick6Mon = null;
                if (!m) return;
                var em = RB.engineState();
                var endUser = em ? em.userScore : null;
                var endOpp  = em ? em.opponentScore : null;
                var lines = [];
                var rows  = [];   // console.table rows — the per-device diagnostics table

                    if (!cond) allOk = false;

                if (m.role === 'SCORER') {
                    verdict(m.modalPops === 1,
                        'PAT modal appeared exactly once',
                        'PAT modal appeared ' + m.modalPops + ' times (expected 1) — engine re-entered the TD/PAT path');
                    var ud = endUser - m.startUser;
                    verdict(ud >= 0 && ud <= 2,
                        'your team gained +' + ud + ' from the PAT (correct team)',
                        'your team changed by ' + ud + ' across the PAT (expected 0, +1 or +2)');
                    verdict(endOpp === m.startOpp,
                        'opponent score untouched during your PAT',
                        'opponent score changed by ' + (endOpp - m.startOpp) + ' during YOUR PAT — wrong-team credit');

                        'PAT_RESULT was never sent — the opponent will stall until the 75s fallback');

                    var base = (typeof m.driveStartOpp === 'number') ? m.driveStartOpp : m.startOpp;
                    var od = endOpp - base;
                    verdict(od >= 6 && od <= 8,
                        'opponent (the scorer) gained +' + od + ' total (TD + PAT)',
                        'opponent gained ' + od + ' across the pick-6 (expected 6-8) — points lost or misrouted');
                    verdict(endUser === m.startUser,
                        'your score untouched (you threw the pick)',
                        'YOUR score changed by ' + (endUser - m.startUser) + ' — points went to the wrong team');

                        'a PAT modal stayed visible ~' + (m.modalMaxConsec * 100) + 'ms on the THROWER device — it belongs on the scorer\'s');

                    (m.notes.length ? '\n--- timeline ---\n' + m.notes.join('\n') : '') +

                try {

                    if (m.notes.length) {
                        console.table(m.notes.map(function (n) {

            setInterval(function () {
                if (!pick6Mon) return;
                try {
                    var em = RB.engineState();
                    var popups = window._rb2p_enumeratePopupInstances ? window._rb2p_enumeratePopupInstances() : [];
                    var patBtns = 0;
                    for (var i = 0; i < popups.length; i++) {

                        t11: em ? em.engineDownNumber : null,
                        Vy:  em ? em.engineDriveFsmStage : null,
                        kp:  em ? em.engineControllerState : null,
                        UD:  em ? em.enginePossessingTeamIdx : null,
                        u:   em ? em.userScore : null,
                        o:   em ? em.opponentScore : null,

                        cascade: window._rb2p_pickSixPatCascadeActive === true,
                        pending: window._rb2p_patPlayPending === true

                    if (p) {
                        var diffs = [];
                        for (var k in snap) {
                            if (snap[k] !== p[k]) diffs.push(k + ':' + p[k] + '→' + snap[k]);

                        if (diffs.length) {

                        if (!(p && p.modal)) pick6Mon.modalPops++;

                        if (pick6Mon.modalConsec > pick6Mon.modalMaxConsec) pick6Mon.modalMaxConsec = pick6Mon.modalConsec;
                    } else {

                            if (rec) parts.push(rec + ' REC');
                        } else if (pos >= 6 && pos <= 9) {   // defense
                            if (tck) parts.push(tck + ' TCK');
                            if (sck) parts.push(sck + ' SCK');
                            if (intc) parts.push(intc + ' INT');
                        } else if (pos === 10 || pos === 11) { // kicker
                            if (fga > 0) parts.push(fgm + '/' + fga + ' FG');
                            if (td) parts.push(td + ' TD');
                        } else {
                            if (yds) parts.push(yds + ' YDS');
                            if (td) parts.push(td + ' TD');
                            if (tck) parts.push(tck + ' TCK');
                        }
                        if (fum) parts.push(fum + ' FUM');
                        if (!parts.length) continue;
                        var fname = '', lname = '';
                        try { fname = String(_Ai(s, 'fname') || ''); } catch (e) {}
                        try { lname = String(_Ai(s, 'lname') || ''); } catch (e) {}
                        var nm = (fname ? fname.charAt(0) + '. ' : '') + lname;
                        report.players.push({
                            name: nm || 'Player', pos: POS_LABELS[pos] || '?',
                            line: parts.join(' · '), sort: yds + td * 100 + (tck + sck + intc) * 10
                        });
                    }
                    report.players.sort(function (a, b) { return b.sort - a.sort; });
                } catch (e) { console.log('[2P FINAL] collect err', e); }
                return report;
            };

            // Game-over detector. Primary signal: engine FSM stage 13 (the
            // game-over display stage the engine enters from _Ib1 case 19).
            // Fallback: Q4+ with the clock at 0:00 and a non-tied score.
            // One-shot per match; reset when a fresh match starts (score 0-0,
            // Q1) so a rematch re-arms it.
            window._rb2p_gameOverReported = false;
            setInterval(function () {
                try {
                    if (!RB.isEngineInMatchRoom()) return;
                    var em = RB.engineState();
                    if (!em || em.engineUserTeamIdx == null) return;
                    var q = Number(em.engineQuarter) || 1;
                    var mn = Number(em.engineMinutesLeft);
                    var sc = Number(em.engineSecondsLeft);
                    var u = Number(em.userScore) || 0, o = Number(em.opponentScore) || 0;
                    // Re-arm on a clearly-fresh match.
                    if (window._rb2p_gameOverReported && q <= 1 && u === 0 && o === 0) {
                        window._rb2p_gameOverReported = false;
                    }
                    if (window._rb2p_gameOverReported) return;
                    // V62: NEVER end on a tie — a tie goes to overtime. So
                    // every game-over signal requires the score to differ:
                    //   • stageOver: engine reached the game-over display
                    //     stage (only persists for a non-tie; on a tie the
                    //     engine resets _Vy to 1 for the OT kickoff).
                    //   • regulationOver: Q4 clock at 0:00, non-tied.
                    //   • otSuddenDeath: in OT (Q5+), the instant the score
                    //     stops being tied, the game is won.
                    if (u === o) return;
                    // V81 FIX: the old `stage 13 = game over` signal was
                    // WRONG — FSM stage 13 is the END-OF-QUARTER display the
                    // engine enters after EVERY quarter (retrobowl.js _Ib1
                    // case 19 sets _Vy=13, THEN increments _Wy), so any
                    // quarter ending with a non-tied score showed FINAL after
                    // Q1. Stage-13 is dropped entirely. The unambiguous
                    // signals are:
                    //   • pastRegulation: the engine already incremented the
                    //     quarter PAST 4 (happens only when Q4 ended). With a
                    //     non-tied score that's the final whistle; with a tie
                    //     the OT flow (below) takes over, and the first OT
                    //     score makes this fire = sudden death.
                    //   • regulationOver: Q4 clock at 0:00 with the play
                    //     resolved (controller not in active-play state 2),
                    //     for the moment before the engine's own transition.
                    var pastRegulation = (q >= 5);
                    var regulationOver = (q === 4 && mn === 0 && sc === 0 &&
                                          em.engineControllerState !== 2);
                    if (!pastRegulation && !regulationOver) return;
                    window._rb2p_gameOverReported = true;
                    var report = window._rb2p_collectBoxScore();
                    console.log('[2P FINAL] game over — ' + report.team + ' ' + report.score +
                                ', ' + report.players.length + ' players with stats');
                    if (typeof window._rb2p_reportGameOver === 'function') {
                        window._rb2p_reportGameOver(report);
                    }
                } catch (e) {}
            }, 300);

            // ===== V62: overtime =====
            // When regulation ends tied the engine tries to start OT, but it
            // computes the OT possession as `_UD = _0z ? 0 : 1` — relative to
            // each device's own team — so the two devices DISAGREE about who
            // received (each thinks the opponent did) and the drive hangs.
            // Fix: a shared coin flip over Firebase decides the receiver, and
            // this device routes possession the same way the opening kickoff
            // does (forceUserOffenseDrive for the receiver, WAIT for the
            // other). After that, normal 2P send/receive carries OT, and the
            // sudden-death branch above ends it on the first score.
            var otInitedPeriod = -1;
            setInterval(function () {
                try {
                    if (!RB.isEngineInMatchRoom()) return;
                    var em = RB.engineState();
                    if (!em || em.engineUserTeamIdx == null) return;
                    var q = Number(em.engineQuarter) || 1;
                    // Reset the per-period guard when a fresh match starts.
                    if (q <= 1) { otInitedPeriod = -1; return; }
                    if (q < 5) return;                       // regulation
                    if (em.userScore !== em.opponentScore) return;  // someone leads → sudden death handles it
                    if (otInitedPeriod === q) return;        // already requested this OT period
                    otInitedPeriod = q;
                    console.log('[2P OT] tied entering OT period ' + q + ' — requesting shared kickoff');
                    if (typeof window._rb2p_requestOtKickoff === 'function') {
                        window._rb2p_requestOtKickoff(q);
                    }
                } catch (e) {}
            }, 300);

            // Apply the shared OT coin flip on THIS device. receiverRole is
            // 'a'/'b'; map to team index (a=Buffalo=0, b=Kansas City=1).
            window._rb2p_applyOtKickoff = function (receiverRole) {
                try {
                    var em = RB.engineState();
                    if (!em || em.engineUserTeamIdx == null) return;
                    var myRoleByTeam = (em.engineUserTeamIdx === 0) ? 'a' : 'b';
                    window._rb2p_pickSixPatCascadeActive = false;
                    window._rb2p_pickSixThisDeviceIsThrower = false;
                    if (myRoleByTeam === receiverRole) {
                        // I receive the OT kickoff → I'm on offense.
                        window._rb2p_userIsWaitingForOpponent = false;
                        window._rb2p_userOutcomeSendInProgress = false;
                        window._rb2p_lastOpponentOutcomeApplyMs = Date.now();
                        var yard = -(25 + Math.floor(Math.random() * 16));
                        if (typeof window._rb2p_forceUserOffenseDrive === 'function') {
                            window._rb2p_forceUserOffenseDrive(yard);
                        }
                        console.log('[2P OT] received kickoff — on offense at ' + yard);
                    } else {
                        // Opponent receives → I wait on defense.
                        em.enginePossessingTeamIdx = em.engineOpponentTeamIdx;
                        window._rb2p_userIsWaitingForOpponent = true;
                        console.log('[2P OT] opponent received kickoff — waiting');
                    }
                } catch (e) { console.log('[2P OT apply err]', e); }
            };
        })();

        // synced rows. Keyed/replaced by player name so re-arrival is idempotent.
        var DEF_POS_LABEL = { 6: 'DL', 7: 'LB', 8: 'DB', 9: 'DB' };

            if (!localFinalReport || !defStats || !defStats.length) return;

                var tck = Math.round(d.tck || 0), sck = Math.round(d.sck || 0), intc = Math.round(d.int || 0);

        // ===== V62: overtime coordination =====

        // ---- Team selection (V66) ----
        // Each player picks their own NFL team (UID 0-31, Teams.txt order).
        // Picks are shared via rooms/{code}/teams/{role}; both devices need
        // both picks (my UID = engine user team, opp UID = engine opponent
        // team). Defaults: A=Buffalo(0), B=Kansas City(5).
        var NFL_TEAMS = ['Buffalo', 'Miami', 'New England', 'New York J', 'Denver',

            'Tennessee', 'Dallas', 'New York G', 'Philadelphia', 'Washington',
            'Arizona', 'Los Angeles R', 'San Francisco', 'Seattle', 'Chicago',

        var teamByRole = { a: 0, b: 5 };
        var $teamSelect = document.getElementById('rb-team-select');
        NFL_TEAMS.forEach(function (name, uid) {
            var opt = document.createElement('option');

        });
        function updateTeamUI() {
            var oppRole = myRole === 'a' ? 'b' : 'a';
            var myUid = teamByRole[myRole];
            var oppUid = teamByRole[oppRole];
            window._rb2p_myTeamUid = myUid;
            window._rb2p_oppTeamUid = oppUid;
            if ($teamSelect && myUid != null) $teamSelect.value = String(myUid);
            try {
                $slotA.querySelector('.team').textContent =
                    (NFL_TEAMS[teamByRole.a] || 'Buffalo').toUpperCase();
                $slotB.querySelector('.team').textContent =
                    (NFL_TEAMS[teamByRole.b] || 'Kansas City').toUpperCase();
            } catch (e) {}
        }
        if ($teamSelect) {
            $teamSelect.addEventListener('change', function () {
                var uid = parseInt($teamSelect.value, 10);
                if (!(uid >= 0 && uid <= 31)) return;
                teamByRole[myRole] = uid;
                updateTeamUI();
                if (myRoom && myRole) {
                    FB.set(FB.ref(db, 'rooms/' + myRoom + '/teams/' + myRole), uid)
                      .catch(function () {});
                }
                // V82: choosing a team opens the engine's own roster page
                // (read-only — career buttons stripped, BACK returns here).
                if (!gameStarted && typeof window._rb2p_previewRoster === 'function') {
                    window._rb2p_afterPreview = function () {
                        lobby.style.display = 'flex';
                        showView('room');
                    };
                    if (window._rb2p_previewRoster(uid)) {
                        lobby.style.display = 'none';
                    }
                }
            });
        }

        var $leaveGame = document.getElementById('rb-leave-game');
        function showLeaveGameBtn(on) { if ($leaveGame) $leaveGame.style.display = on ? 'block' : 'none'; }
        if ($leaveGame) {
            $leaveGame.addEventListener('click', async function () {
                if (!window.confirm('Leave the game and return to the lobby?')) return;
                var room = myRoom;
                try { await leaveRoom(); } catch (e) {}
                try {
                    sessionStorage.removeItem('rb_room');
                    if (room) sessionStorage.removeItem('rb_role_' + room);
                } catch (e) {}
                location.reload();   // fresh page → entry screen, no resume
            });
        }

        function showView(name) {
            lobby.dataset.active = name;
            lobby.style.display = 'flex';
            showLeaveGameBtn(false);   // in the lobby, not the game
            if (name === 'entry') {
                setTimeout(function () { try { $input.focus(); $input.select(); } catch (e) {} }, 50);
            }
        }
        function hideLobby() { lobby.style.display = 'none'; showLeaveGameBtn(true); }

        // ---- Lobby state ----
        var myRoom = null;
        var myRole = null;
        var myReady = false;
        var unsubscribePlayers = null;
        var unsubscribeOutcomes = null;
        var unsubscribeConfig = null;
        var unsubscribeFinal = null;
        var unsubscribeDefStats = null;
        var unsubscribeOt = null;
        var unsubscribeTeams = null;
        var otAppliedPeriods = {};
        var gameStarted = false;

        showView('entry');

        // ---- Resume an in-progress match after a reload ----
        // Relaunch the engine and restore the synced score/clock/quarter +
        // possession from the opponent's last live state, instead of
        // restarting from 0-0. Field position is unrecoverable (a fresh drive
        // is spawned / WAIT shown), but the game state carries over.
        function resumeMatch(role, oppLive) {
            gameStarted = true;   // block the players-subscription from restarting
            window._rb2p_gameOverReported = false;
            window._rb2p_resumeState = {
                myScore:  Number(oppLive.oppScore) || 0,   // opp's "oppScore" = MY score
                oppScore: Number(oppLive.myScore) || 0,    // opp's "myScore"  = opp's score
                quarter:  Number(oppLive.quarter) || 1,
                minutes:  Number(oppLive.minutesLeft) || 0,
                seconds:  Number(oppLive.secondsLeft) || 0,
                // If the opponent has the ball, I must wait; otherwise I take
                // over on offense. Missing flag (old payload) → take the ball
                // (avoids both sides waiting → deadlock).
                iHaveBall: !(oppLive.iHaveBall === true)
            };
            hideLobby();
            console.log('[2P RESUME] resuming match as ' + role);
            window.s_play_two_player_match(role);
        }

        // ---- Restore session if a refresh happened ----
        // We only restore if the slot in the DB still matches our session.
        // Otherwise (slot taken, or DB cleared), drop back to entry cleanly.
        (async function tryRestore() {
            var savedRoom = sessionStorage.getItem('rb_room');
            if (!savedRoom) return;
            var savedRole = sessionStorage.getItem('rb_role_' + savedRoom);
            if (!savedRole) return;
            try {
                var oppRole = savedRole === 'a' ? 'b' : 'a';
                // Is a match in progress? The opponent pushes live state every
                // 500ms; a recent payload means the game is live. Check this
                // BEFORE entering the room so the players subscription can't
                // fire a fresh startMatch underneath us.
                var oppLiveSnap = await FB.get(FB.ref(db, 'rooms/' + savedRoom + '/live/' + oppRole));
                var oppLive = oppLiveSnap.val();
                var finalSnap = await FB.get(FB.ref(db, 'rooms/' + savedRoom + '/final/' + savedRole));
                var inProgress = oppLive && (Date.now() - (Number(oppLive.ts) || 0) < 25000);

                // Make sure our slot exists (re-claim if onDisconnect cleared it).
                var snap = await FB.get(FB.ref(db, 'rooms/' + savedRoom + '/players/' + savedRole));
                if (!snap.exists()) {
                    await FB.set(FB.ref(db, 'rooms/' + savedRoom + '/players/' + savedRole),
                                 { ts: Date.now(), ready: inProgress ? true : false });
                }

                if (inProgress && !finalSnap.exists()) {
                    // Pull the shared quarter length before launch so _Ws is right.
                    try {
                        var cfgSnap = await FB.get(FB.ref(db, 'rooms/' + savedRoom + '/config/quarterMins'));
                        var cfg = cfgSnap.val();
                        if (cfg === 1 || cfg === 2 || cfg === 3) applyLengthLocal(cfg);
                    } catch (e) {}
                    // Pull the shared team picks before launch so the engine
                    // rebuilds the match with the right teams on resume.
                    try {
                        var teamsSnap = await FB.get(FB.ref(db, 'rooms/' + savedRoom + '/teams'));
                        var ts = teamsSnap.val() || {};
                        if (ts.a >= 0 && ts.a <= 31) teamByRole.a = ts.a;
                        if (ts.b >= 0 && ts.b <= 31) teamByRole.b = ts.b;
                        myRole = savedRole;   // updateTeamUI reads myRole
                        updateTeamUI();
                    } catch (e) {}
                    gameStarted = true;   // set before enterRoom subscribes
                    enterRoom(savedRoom, savedRole, /*restoring=*/true);
                    resumeMatch(savedRole, oppLive);
                    return;
                }

                enterRoom(savedRoom, savedRole, /*restoring=*/true);
            } catch (e) {
                sessionStorage.removeItem('rb_room');
                sessionStorage.removeItem('rb_role_' + savedRoom);
            }
        })();

        // ---- Entry handlers ----
        $input.addEventListener('input', function () {
            $input.value = $input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });
        $input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') $join.click();
        });
        $join.addEventListener('click', function () { joinByCode(); });

        async function joinByCode() {
            $entryMsg.textContent = '';
            var code = ($input.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
            if (code.length < 1) {
                $entryMsg.textContent = 'Enter at least 1 character.';
                return;
            }
            $join.disabled = true;
            try {
                var role = await claimSlot(code);
                if (!role) {
                    $entryMsg.textContent = 'Room ' + code + ' is full.';
                    return;
                }
                enterRoom(code, role, false);
            } catch (e) {
                $entryMsg.textContent = 'Connection error: ' + (e.message || e);
                console.log('[lobby join err]', e);
            } finally {
                $join.disabled = false;
            }
        }

        async function claimSlot(code) {
            // Try A, then B; return the role we ended up with (or null).
            var resA = await FB.runTransaction(
                FB.ref(db, 'rooms/' + code + '/players/a'),
                function (cur) { return cur === null ? { ts: Date.now(), ready: false } : undefined; }
            );
            if (resA.committed) return 'a';
            var resB = await FB.runTransaction(
                FB.ref(db, 'rooms/' + code + '/players/b'),
                function (cur) { return cur === null ? { ts: Date.now(), ready: false } : undefined; }
            );
            if (resB.committed) return 'b';
            return null;
        }

        function enterRoom(code, role, restoring) {
            myRoom = code;
            myRole = role;
            myReady = false;
            gameStarted = false;
            sessionStorage.setItem('rb_room', code);
            sessionStorage.setItem('rb_role_' + code, role);

            $roomName.textContent = code;
            $youRole.textContent = role.toUpperCase();
            $slotA.classList.toggle('you', role === 'a');
            $slotB.classList.toggle('you', role === 'b');
            $ready.textContent = 'READY';
            $ready.dataset.state = 'not-ready';

            // Subscribe to player presence
            unsubscribePlayers = FB.onValue(
                FB.ref(db, 'rooms/' + code + '/players'),
                function (snap) {
                    var players = snap.val() || {};
                    renderPlayers(players);
                    if (players.a && players.b && players.a.ready && players.b.ready && !gameStarted) {
                        gameStarted = true;
                        startMatch();
                    }
                }
            );

            // V60: subscribe to the shared game-length config. Whoever set it
            // last wins; both devices reflect the same value. If nobody has
            // set it yet (config absent), seed it from this device's last
            // local pick so the room opens with a sensible shared default.
            unsubscribeConfig = FB.onValue(
                FB.ref(db, 'rooms/' + code + '/config/quarterMins'),
                function (snap) {
                    var v = snap.val();
                    if (v === 1 || v === 2 || v === 3) {
                        applyLengthLocal(v);
                    } else if (role === 'a') {
                        // No shared value yet — the host (A) seeds the room
                        // with its local pick so B inherits it. Only A seeds,
                        // so the two devices don't write competing defaults.
                        FB.set(FB.ref(db, 'rooms/' + code + '/config/quarterMins'),
                               currentQuarterMins).catch(function () {});
                    }
                }
            );

            // V61: opponent's end-of-game box score. When it arrives (and we
            // already have our own / the game is over), merge it into the
            // FINAL screen so both teams' players show on this device.
            var oppRole = role === 'a' ? 'b' : 'a';
            unsubscribeFinal = FB.onValue(
                FB.ref(db, 'rooms/' + code + '/final/' + oppRole),
                function (snap) {
                    var rep = snap.val();
                    if (!rep) { oppFinalReport = null; return; }
                    oppFinalReport = rep;
                    // Only (re)render if our side has already ended — avoids a
                    // stale report flashing the screen mid-game.
                    if (localFinalReport) renderFinal();
                }
            );

            // V89: my defense's stats, measured & published by the opponent's
            // device (keyed by MY role). Merge into my FINAL when it arrives.
            unsubscribeDefStats = FB.onValue(
                FB.ref(db, 'rooms/' + code + '/defstats/' + role),
                function (snap) {
                    var ds = snap.val();
                    if (!ds || !ds.length) return;
                    myDefStats = ds;
                    if (localFinalReport) { mergeMyDefStats(ds); renderFinal(); }
                }
            );

            // V66: team picks. Seed this device's default if unset, then
            // mirror both picks into the UI and the engine-launch globals.
            updateTeamUI();
            unsubscribeTeams = FB.onValue(
                FB.ref(db, 'rooms/' + code + '/teams'),
                function (snap) {
                    var t = snap.val() || {};
                    if (t.a === 0 || (t.a >= 0 && t.a <= 31)) teamByRole.a = t.a;
                    if (t.b === 0 || (t.b >= 0 && t.b <= 31)) teamByRole.b = t.b;
                    // Seed my default into the room if I haven't picked yet.
                    if (t[role] == null) {
                        FB.set(FB.ref(db, 'rooms/' + code + '/teams/' + role),
                               teamByRole[role]).catch(function () {});
                    }
                    updateTeamUI();
                }
            );

            // V62: shared OT coin flip. Each p{period} entry names the
            // receiver; both devices apply it once via the bridge.
            unsubscribeOt = FB.onValue(
                FB.ref(db, 'rooms/' + code + '/ot'),
                function (snap) {
                    var ot = snap.val() || {};
                    Object.keys(ot).forEach(function (key) {
                        var entry = ot[key];
                        if (!entry || (entry.receiver !== 'a' && entry.receiver !== 'b')) return;
                        if (otAppliedPeriods[key]) return;
                        otAppliedPeriods[key] = true;
                        console.log('[2P OT] applying ' + key + ' — receiver=' + entry.receiver);
                        showOtBanner(entry.receiver);
                        if (typeof window._rb2p_applyOtKickoff === 'function') {
                            window._rb2p_applyOtKickoff(entry.receiver);
                        }
                    });
                }
            );

            // Release slot on tab close so the room frees up
            FB.onDisconnect(FB.ref(db, 'rooms/' + code + '/players/' + role)).remove();

            showView('room');
        }

        function renderPlayers(players) {
            var a = players.a;
            var b = players.b;
            $slotA.querySelector('.state').textContent =
                a ? (a.ready ? '✓ READY' : '· not ready') : 'EMPTY';
            $slotB.querySelector('.state').textContent =
                b ? (b.ready ? '✓ READY' : '· not ready') : 'EMPTY';
            $slotA.classList.toggle('ready', !!(a && a.ready));
            $slotB.classList.toggle('ready', !!(b && b.ready));

            var bothIn = !!(a && b);
            $ready.disabled = !bothIn;
            if (!bothIn) {
                $status.textContent = 'Waiting for opponent to join…';
            } else if (a.ready && b.ready) {
                $status.textContent = 'Starting…';
            } else if (
                (myRole === 'a' && a.ready) ||
                (myRole === 'b' && b.ready)
            ) {
                $status.textContent = 'Waiting for opponent to ready up…';
            } else {
                $status.textContent = 'Both players in — ready up to start.';
            }
        }

        // ---- Ready toggle ----
        $ready.addEventListener('click', async function () {
            if (!myRoom || !myRole) return;
            myReady = !myReady;
            $ready.disabled = true;
            try {
                await FB.set(
                    FB.ref(db, 'rooms/' + myRoom + '/players/' + myRole + '/ready'),
                    myReady
                );
                $ready.textContent = myReady ? 'CANCEL' : 'READY';
            } catch (e) {
                console.log('[lobby ready err]', e);
                myReady = !myReady;
            } finally {
                $ready.disabled = false;
            }
        });

        // ---- Leave ----
        $leave.addEventListener('click', async function () {
            await leaveRoom();
        });

        async function leaveRoom() {
            if (unsubscribePlayers) { unsubscribePlayers(); unsubscribePlayers = null; }
            if (unsubscribeOutcomes) { unsubscribeOutcomes(); unsubscribeOutcomes = null; }
            if (unsubscribeConfig) { unsubscribeConfig(); unsubscribeConfig = null; }
            if (unsubscribeFinal) { unsubscribeFinal(); unsubscribeFinal = null; }
            if (unsubscribeDefStats) { unsubscribeDefStats(); unsubscribeDefStats = null; }
            if (unsubscribeOt) { unsubscribeOt(); unsubscribeOt = null; }
            if (unsubscribeTeams) { unsubscribeTeams(); unsubscribeTeams = null; }
            try {
                if (myRoom && myRole) {
                    await FB.remove(FB.ref(db, 'rooms/' + myRoom + '/players/' + myRole));
                }
            } catch (e) { /* best effort */ }
            sessionStorage.removeItem('rb_room');
            if (myRoom) sessionStorage.removeItem('rb_role_' + myRoom);
            myRoom = null; myRole = null; myReady = false; gameStarted = false;
            $slotA.classList.remove('you', 'ready');
            $slotB.classList.remove('you', 'ready');
            $ready.textContent = 'READY';
            $input.value = '';
            $entryMsg.textContent = '';
            showView('entry');
        }

        // ---- Match start ----
        function startMatch() {
            // Wire SEND to Firebase BEFORE entering the engineMatch. The local
            // bridge already mutates _twoPlayer.send once installed; we
            // chain on top of whatever's there so simulate()/sentLog still
            // work for debugging.
            var origSend = window._twoPlayer.send.bind(window._twoPlayer);
            window._twoPlayer.send = function (outcome) {
                origSend(outcome);
                FB.set(
                    FB.ref(db, 'rooms/' + myRoom + '/outcomes/' + myRole),
                    outcome
                ).catch(function (e) { console.log('[fb send err]', e); });
            };

            // Subscribe to opponent outcomes. Skip the first snapshot
            // (it's a stale read from any prior session).
            var otherRole = myRole === 'a' ? 'b' : 'a';
            var firstSnap = true;
            var lastTs = 0;
            unsubscribeOutcomes = FB.onValue(
                FB.ref(db, 'rooms/' + myRoom + '/outcomes/' + otherRole),
                function (snap) {
                    var val = snap.val();
                    if (firstSnap) {
                        firstSnap = false;
                        lastTs = (val && val.ts) || 0;
                        return;
                    }
                    if (!val || !val.ts || val.ts <= lastTs) return;
                    lastTs = val.ts;
                    window._twoPlayer.receive(val);
                }
            );

            // In-game badge so the player remembers which side they're on
            var badge = document.createElement('div');
            badge.id = 'rb-fb-badge';
            badge.style.cssText =
                'position:fixed;left:6px;top:6px;padding:5px 10px;' +
                'background:rgba(0,0,0,0.78);color:#3cff7a;' +
                'font:bold 11px monospace;z-index:9999;border-radius:4px;' +
                'letter-spacing:2px;border:1px solid #3cff7a;';
            document.body.appendChild(badge);
            // V72: show the REAL team the engine loaded (was hardcoded
            // BUF/KC, which lied once teams became selectable). Reads the
            // live team name so it always matches the scoreboard/jersey.
            function updateBadge() {
                var label = 'RM:' + myRoom + ' • YOU:' + (myRole ? myRole.toUpperCase() : '?');
                try {
                    if (window.RB && window.RB.isEngineInMatchRoom && window.RB.isEngineInMatchRoom()) {
                        var em = window.RB.engineState();
                        if (em && em.engineTeamDisplayNames && em.engineUserTeamIdx != null) {
                            var nm = em.engineTeamDisplayNames[em.engineUserTeamIdx];
                            if (nm) label += ' — ' + String(nm).toUpperCase();
                        }
                    }
                } catch (e) {}
                badge.textContent = label;
            }
            updateBadge();
            setInterval(updateBadge, 500);

            // ---- Live state sync ----
            // While I'm on offense, push my local score + clock every 500ms
            // to /rooms/{CODE}/live/{me}. The opponent is on defense (parked
            // in WAIT) and won't be writing, so there's no race for who's
            // authoritative — the offensive side always is.
            //
            // The receiving side mirrors the pushed values into their local
            // m._Sb1 / m._Yc1 / m._Wy so the in-game scoreboard and clock
            // visible behind the WAITING overlay both reflect what's
            // happening on the offensive side in near-realtime.
            //
            // At drive end the SEND outcome carries the same absolute
            // scores; applyOpponentOutcome sets them again (no double-count because
            // it's an assignment, not an increment).
            function qtrName(q) {
                if (q === 1) return '1ST QTR';
                if (q === 2) return '2ND QTR';
                if (q === 3) return '3RD QTR';
                if (q === 4) return '4TH QTR';
                if (q === 5) return 'OT';
                return 'QTR ' + q;
            }
            function formatClock(q, elapsed, duration) {
                var rem = Math.max(0, (duration || 0) - (elapsed || 0));
                var mins = Math.floor(rem / 60);
                var secs = Math.floor(rem % 60);
                return qtrName(q) + ' ' + mins + ':' + (secs < 10 ? '0' : '') + secs;
            }
            function formatClockRS(q, mins, secs) {
                mins = Math.max(0, mins | 0);
                secs = Math.max(0, secs | 0);
                return qtrName(q) + ' ' + mins + ':' + (secs < 10 ? '0' : '') + secs;
            }

            var userLivePushSeq = 0;
            setInterval(function () {
                try {
                    if (!RB.isEngineInMatchRoom()) return;
                    var engineMatch = RB.engineState();
                    if (!engineMatch || engineMatch.engineScoreboard == null ||
                        engineMatch.engineUserTeamIdx == null) return;
                    // Push from both sides. The receive side only mirrors
                    // when the user is on defense, so we don't fight over
                    // who's authoritative — but during kickoff sequences
                    // possession swaps around and either side can be "on
                    // offense" briefly, so we always emit and let the
                    // receiver gate.
                    var userLivePayload = {
                        // Field names "myScore"/"oppScore" are kept in the
                        // wire payload (SENDER's perspective: my = sender's
                        // team, opp = remote opponent's team) so that
                        // existing rooms in Firebase remain compatible.
                        myScore:     Number(engineMatch.userScore) || 0,
                        oppScore:    Number(engineMatch.opponentScore) || 0,
                        // Legacy (elapsed/duration) kept for backward compat;
                        // new fields minutesLeft/secondsLeft come straight
                        // off the engine's visible display registers.
                        elapsed:     Number(engineMatch.engineTickAllowance) || 0,
                        // V60: quarter length in seconds. The old code used
                        // engineQuarterLengthMins (which maps to _5F = the
                        // TIMEOUTS field, not quarter length) — a latent bug.
                        // Use the shared chosen length instead.
                        duration:    ((Number(window._rb2p_quarterMins) || 2) * 60),
                        minutesLeft: Number(engineMatch.engineMinutesLeft),
                        secondsLeft: Number(engineMatch.engineSecondsLeft),
                        quarter:     Number(engineMatch.engineQuarter) || 1,
                        // V65: possession flag so a reloading opponent can
                        // resume on the correct side (if I have the ball, the
                        // opponent who just reloaded must wait, and vice versa).
                        iHaveBall:   window._rb2p_userIsWaitingForOpponent !== true,
                        seq: ++userLivePushSeq,
                        ts: Date.now()
                    };
                    FB.set(FB.ref(db, 'rooms/' + myRoom + '/live/' + myRole), userLivePayload)
                        .catch(function () {});
                } catch (e) {}
            }, 500);

            // Subscribe to opponent's live state. When it arrives and the
            // user is on defense (or just not yet on offense), mirror it
            // into the local engine match instance and refresh the WAITING
            // overlay.
            var lastOpponentLiveTs = 0;
            FB.onValue(
                FB.ref(db, 'rooms/' + myRoom + '/live/' + otherRole),
                function (snap) {
                    var opponentLivePayload = snap.val();
                    if (!opponentLivePayload || !opponentLivePayload.ts ||
                        opponentLivePayload.ts <= lastOpponentLiveTs) return;
                    lastOpponentLiveTs = opponentLivePayload.ts;
                    var engineMatch = RB.engineState();
                    if (!engineMatch || engineMatch.engineScoreboard == null ||
                        engineMatch.engineUserTeamIdx == null) return;
                    // opponentLivePayload.myScore  = sender's team   = user's opponent
                    // opponentLivePayload.oppScore = sender's opp    = user's team
                    //
                    // Sync engineScoreboard, engineMinutesLeft, engineSecondsLeft,
                    // and engineQuarter into the engine while the user is on
                    // defense. The scoreboard renderer (_qh1) reads minutes/
                    // seconds directly — those are the visible MIN:SEC. The
                    // engineTickAllowance is a separate sub-second counter;
                    // we deliberately set it to 0 so the engine doesn't try
                    // to drain the clock on the user's side while parked.
                    var userIsOnDefense = engineMatch.enginePossessingTeamIdx !==
                                          engineMatch.engineUserTeamIdx;
                    // V50 Checkpoint 3 fix: while we're actively playing the
                    // pick-6 PAT scene (cascade flag is true AND engineDownNumber
                    // is the PAT-pending marker 6), OUR local engine is the
                    // authoritative score source. Suppress the live-sync
                    // overwrite so a stale push from the opponent (whose view
                    // doesn't yet include our PAT credit) cannot wipe the
                    // just-credited +1 or +2. The cascade flag clears
                    // event-driven once _._t11 transitions out of 6 (the post-
                    // PAT kickoff runs _1c1 which resets it to 1).
                    var localPlayingPatScene =
                        window._rb2p_pickSixPatCascadeActive === true &&
                        engineMatch.engineDownNumber === 6;
                    // V50 Checkpoint 3 monotonic insurance: scores never
                    // decrease in football. If the incoming push would reduce
                    // either team's score below our current local view, the
                    // push is stale (from before our just-applied credit) and
                    // we reject it. Without this, the ~500 ms window between
                    // our local _1c1 firing (which flips _UD and opens the
                    // gate above) and the opponent receiving our drive-end
                    // outcome would let a stale push wipe our credit.
                    var pushWouldRegressScore =
                        (typeof opponentLivePayload.oppScore === 'number' &&
                         opponentLivePayload.oppScore < engineMatch.userScore) ||
                        (typeof opponentLivePayload.myScore === 'number' &&
                         opponentLivePayload.myScore < engineMatch.opponentScore);
                    if (userIsOnDefense && !localPlayingPatScene && !pushWouldRegressScore) {
                        engineMatch.setOpponentScore(opponentLivePayload.myScore);
                        engineMatch.setUserScore(opponentLivePayload.oppScore);
                        if (window._rb2p_notePick6BaselineSync) window._rb2p_notePick6BaselineSync();
                        if (typeof opponentLivePayload.minutesLeft === 'number')
                            engineMatch.engineMinutesLeft = opponentLivePayload.minutesLeft;
                        if (typeof opponentLivePayload.secondsLeft === 'number')
                            engineMatch.engineSecondsLeft = opponentLivePayload.secondsLeft;
                        if (typeof opponentLivePayload.quarter === 'number')
                            engineMatch.engineQuarter = opponentLivePayload.quarter;
                        engineMatch.engineTickAllowance = 0;
                    }
                    // Always refresh the WAITING overlay text, even if we
                    // couldn't safely mutate the engine state (e.g. match
                    // singleton doesn't exist yet).
                    if (window._twoPlayer && window._twoPlayer.refreshWaitDisplay) {
                        var clockText;
                        if (typeof opponentLivePayload.minutesLeft === 'number' &&
                            typeof opponentLivePayload.secondsLeft === 'number') {
                            clockText = formatClockRS(opponentLivePayload.quarter,
                                                      opponentLivePayload.minutesLeft,
                                                      opponentLivePayload.secondsLeft);
                        } else {
                            clockText = formatClock(opponentLivePayload.quarter,
                                                    opponentLivePayload.elapsed,
                                                    opponentLivePayload.duration);
                        }
                        window._twoPlayer.refreshWaitDisplay(
                            opponentLivePayload.oppScore,   // user, from sender's perspective
                            opponentLivePayload.myScore,    // opp,  from sender's perspective
                            clockText
                        );
                    }
                }
            );

            // V61: clear any prior game's box score so the FINAL screen for
            // this match starts blank (the room is reused across rematches).
            localFinalReport = null;
            oppFinalReport = null;
            myDefStats = null;   // V89
            window._rb2p_gameOverReported = false;
            hideFinal();
            FB.remove(FB.ref(db, 'rooms/' + myRoom + '/final')).catch(function () {});
            // V62: clear any prior overtime coin flips so a rematch's OT
            // re-coordinates from scratch.
            otAppliedPeriods = {};
            FB.remove(FB.ref(db, 'rooms/' + myRoom + '/ot')).catch(function () {});

            // V60: lock in the agreed quarter length right before launch so
            // startTwoPlayerMatch reads the final synced value (both devices
            // converged on the same rooms/{code}/config/quarterMins).
            window._rb2p_quarterMins = currentQuarterMins;
            // V82: if a roster preview is open when both players ready up,
            // shut it down so the match launch isn't fighting the preview.
            window._rb2p_rosterPreviewActive = false;

            // V66/V68: lock in the agreed teams (authoritative, no race) so
            // the engine builds the match — and the jerseys — from the
            // selected UIDs rather than any stale/default value. Set the
            // globals DIRECTLY (not via updateTeamUI) so a null myRole or DOM
            // issue can't silently leave them unset.
            window._rb2p_myTeamUid  = teamByRole[myRole];
            window._rb2p_oppTeamUid = teamByRole[myRole === 'a' ? 'b' : 'a'];
            console.log('[2P TEAMS] startMatch myRole=' + myRole +
                        ' teamByRole=' + JSON.stringify(teamByRole) +
                        ' → myTeamUid=' + window._rb2p_myTeamUid +
                        ' oppTeamUid=' + window._rb2p_oppTeamUid);
            hideLobby();
            window.s_play_two_player_match(myRole);
        }
    </script>
